name: Main Workflow
on: [push]
jobs:
  build:
    name: Build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        family: ["iPhone", "iPad"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Pods
        run: pod install
      - name: Select simulator
        id: simulator
        run: echo "udid=$(./scripts/simulator.sh ${{ matrix.family }})" >> "$GITHUB_OUTPUT"
      - name: Show information
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list devices available | grep "${{ steps.simulator.outputs.udid }}"
      - name: Test packages
        run: xcodebuild clean test -workspace cameo.xcworkspace -scheme cameo_test -destination "id=${{ steps.simulator.outputs.udid }}" -showBuildTimingSummary
